# Développement : `docker compose up -d db` suffit (l'API et le site tournent avec npm run dev).
# Tout-en-un (pré-production) : `docker compose up -d --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: colisconsult
      POSTGRES_PASSWORD: colisconsult
      POSTGRES_DB: colisconsult
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colisconsult"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://colisconsult:colisconsult@db:5432/colisconsult
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans un fichier .env à la racine}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@colisconsult.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD dans un fichier .env à la racine}
      UPLOAD_DIR: /app/storage/uploads
      # Images du blog copiées par l'import WordPress (--download-images), servies par le site
      BLOG_IMAGES_DIR: /app/storage/media/blog
      BLOG_IMAGES_URL: /media/blog
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-ColisConsult <noreply@colisconsult.com>}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-commercial@colisconsult.com}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/storage/uploads
      - media:/app/storage/media

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000/api
      MEDIA_DIR: /app/media
    ports:
      - "3000:3000"
    volumes:
      - media:/app/media:ro

volumes:
  pgdata:
  uploads:
  media:
